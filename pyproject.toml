[project]
name = "ContestTrade"
version = "1.1.0"
description = "ContestTrade: an A-share multi-agent research and deterministic signal aggregation system."
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "requests",
    "matplotlib",
    "loguru",
    "openai",
    "tiktoken",
    "typer",
    "pydantic",
    "questionary",
    "prompt_toolkit<3.0.30",
    "python-dotenv",
    "PyYAML",
    "pandas",
    "langgraph",
    "rich",
    "tabulate",
    "akshare>=1.17.49",
    "crawl4ai>=0.7.4",
]

[project.scripts]
contesttrade = "cli.main:app"
