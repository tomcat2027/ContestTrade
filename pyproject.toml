[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ContestTrade"
version = "1.2.0"
description = "ContestTrade: an A-share multi-agent research and deterministic signal aggregation system."
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "requests",
    "matplotlib",
    "loguru",
    "openai",
    "tiktoken",
    "typer",
    "pydantic",
    "questionary",
    "prompt_toolkit<3.0.30",
    "python-dotenv",
    "PyYAML",
    "pandas",
    "langgraph",
    "rich",
    "tabulate",
    "akshare>=1.17.49",
    "crawl4ai>=0.7.4",
]

[project.scripts]
contesttrade = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "contest_trade*"]

[tool.setuptools.package-data]
cli = ["static/*.txt"]
contest_trade = [
    "config/*.json",
    "config/*.yaml",
    "utils/cache/market_manager/*.json",
]
