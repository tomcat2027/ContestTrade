#YOUR_TUSHARE_KEY
tushare_key: "" 

#YOUR_BOCHA_KEY
bocha_key: "" 

#YOUR_SERP_KEY
serp_key: "" 

# ==================================================
# LLM 配置说明 / LLM Configuration
# ==================================================
# 支持的 provider 选项 / Supported provider options:
#   - "openai"  : OpenAI官方API或兼容接口
#   - "gemini"  : Google Gemini API
#   - "ollama"  : 本地Ollama服务
#
# 配置示例 / Configuration examples:
#
# OpenAI:
#   provider: "openai"
#   base_url: "https://bailian.console.aliyun.com"
#   api_key: "your_openai_api_key"
#   model_name: "gpt-4"
#
# DeepSeek (OpenAI compatible):
#   provider: "openai"
#   base_url: "https://bailian.console.aliyun.com"
#   api_key: "your_deepseek_api_key"
#   model_name: "deepseek-chat"
#
# 阶跃星辰 (OpenAI compatible):
#   provider: "openai"
#   base_url: "https://bailian.console.aliyun.com"
#   api_key: "your_stepfun_api_key"
#   model_name: "step-1o-turbo-vision"
#
# Google Gemini:
#   provider: "gemini"
#   base_url: "https://generativelanguage.googleapis.com/v1beta"
#   api_key: "your_gemini_api_key"
#   model_name: "gemini-2.0-flash"
#
# Local Ollama:
#   provider: "ollama"
#   base_url: "http://localhost:11434"
#   api_key: ""  # Ollama usually doesn't require an API key
#   model_name: "llama3.2:1b"
# ==================================================

llm:
  provider: "openai"
  base_url: "https://token.sensenova.cn/v1"
  # 从环境变量 DEEPSEEK_API_KEY 读取（sensenova 端点，按 base_url 匹配注入）
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model_name: "deepseek-v4-flash"

llm_thinking:
  provider: "openai"
  base_url: "https://token.sensenova.cn/v1"
  # flash 无 reasoner，退化为普通调用，reasoning_content 为空
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model_name: "deepseek-v4-flash"

vlm:
  provider: "openai"
  base_url: "https://api.longcat.chat/openai"
  # 从环境变量 LONGCAT_API_KEY 读取，或填写占位符
  # 注：LongCat-2.0 为文本模型，price_market 将走文本分支不传 K线图
  api_key: "YOUR_LONGCAT_API_KEY"
  model_name: "LongCat-2.0"


data_agents_config:
  - agent_name: "sina_summary_agent"
    data_source_list: 
      - "data_source.sina_news_crawl.SinaNewsCrawl"
  - agent_name: "thx_summary_agent"
    data_source_list: 
      - "data_source.thx_news_crawl.ThxNewsCrawl"
  - agent_name: "price_market_agent"
    data_source_list: 
      - "data_source.price_market_akshare.PriceMarketAkshare"
  - agent_name: "hot_money_agent"
    data_source_list: 
      - "data_source.hot_money_akshare.HotMoneyAkshare"

research_agent_config:
  belief_list_path: "config/belief_list.json"
  max_react_step: 6
  output_language: "中文"
  tools:
    - "tools.stock_symbol_search_akshare.stock_symbol_search"
    - "tools.stock_selector_akshare.stock_selector"
    - "tools.corp_info_akshare.company_financial_info"
    - "tools.price_info_akshare.price_info"
    - "tools.search_web.search_web"
    - "tools.stock_summary_akshare.stock_summary"
    - "tools.final_report.final_report"

market_config_file: "config/market_config.yaml"

